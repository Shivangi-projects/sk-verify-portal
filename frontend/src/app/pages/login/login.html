<main class="login-page">
    <form class="login-card card" (ngSubmit)="onLogin()">
        <div class="brand">
            <span class="logo">SK</span>
            <h1>SK Verify Portal</h1>
            <p>Sign in to view and manage employee verifications</p>
        </div>

        <label for="userId">User ID</label>
        <input id="userId" name="userId" type="text" placeholder="Enter your User ID" autocomplete="username"
            [(ngModel)]="userId" />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Enter your password"
            autocomplete="current-password" [(ngModel)]="password" />

        <label for="role">Role</label>
        <select id="role" name="role" [(ngModel)]="role">
            <option value="General User">General User</option>
            <option value="Admin">Admin</option>
        </select>

        @if (error()) {
        <p class="alert error" role="alert">{{ error() }}</p>
        }

        <button type="submit" [disabled]="loading()">
            {{ loading() ? 'Signing in...' : 'Login' }}
        </button>

        <div class="demo">
            <span>Demo accounts</span>
            <div class="chips">
                <button type="button" class="secondary" (click)="fillDemo('admin')">Admin</button>
                <button type="button" class="secondary" (click)="fillDemo('user')">General User</button>
            </div>
        </div>
    </form>
</main>
